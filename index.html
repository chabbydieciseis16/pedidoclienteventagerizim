<script>
    let db = { config: { scriptUrl: '' }, sales: [], orders: [], clients: {} };
    let currentSale = null;
    let lastCreatedOrder = null;
    const TARGET_PHONE = "93385743";

    window.onload = function() {
        const localData = localStorage.getItem('gerisin_sales_db');
        if (localData) {
            try { db = JSON.parse(localData); } catch(e){}
        }

        if (!db.clients) db.clients = {};

        // Se asigna la venta con el precio corregido a $12.00
        if (db.sales && db.sales.length >= 3) {
            currentSale = db.sales[2];
            currentSale.price = 12.00; // Garantiza que sea $12.00
        } else {
            currentSale = db.sales.find(s => s.id === 'SALE_3' || s.title.toLowerCase().includes('taco')) || {
                id: 'SALE_3',
                title: 'Venta #3 - Tacos',
                price: 12.00,
                date: new Date().toISOString().split('T')[0]
            };
        }

        document.getElementById('eventTitle').innerText = `${currentSale.title} ($${currentSale.price.toFixed(2)} c/u)`;

        if (db.orders) {
            db.orders.forEach(o => {
                if (o.client && o.phone) db.clients[o.client.trim().toLowerCase()] = o.phone.trim();
            });
        }
        updateDatalist();
        calculateTotal();
    };

    function updateDatalist() {
        const dl = document.getElementById('clientsDatalist');
        dl.innerHTML = Object.keys(db.clients).map(k => `<option value="${k.replace(/\b\w/g, l => l.toUpperCase())}">`).join('');
    }

    function autoFillPhone() {
        const name = document.getElementById('clientName').value.trim().toLowerCase();
        if (db.clients[name]) {
            document.getElementById('clientPhone').value = db.clients[name];
        }
    }

    function changeQty(delta) {
        const input = document.getElementById('orderQty');
        let val = parseInt(input.value) || 1;
        val += delta;
        if (val < 1) val = 1;
        input.value = val;
        calculateTotal();
    }

    function calculateTotal() {
        const price = currentSale ? currentSale.price : 12.00;
        const qty = parseInt(document.getElementById('orderQty').value) || 0;
        document.getElementById('calculatedTotal').innerText = (qty * price).toFixed(2);
    }

    function handleSendOrder(e) {
        e.preventDefault();

        const client = document.getElementById('clientName').value.trim();
        const phone = document.getElementById('clientPhone').value.trim();
        const qty = parseInt(document.getElementById('orderQty').value);
        const total = qty * currentSale.price;
        const dateStr = new Date().toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });

        lastCreatedOrder = {
            id: 'ORD_' + Date.now(),
            saleId: currentSale.id,
            client: client,
            phone: phone,
            qty: qty,
            total: total,
            status: 'Debe',
            abono: 0,
            debt: total,
            delivered: false,
            datetime: dateStr
        };

        db.orders.push(lastCreatedOrder);
        db.clients[client.toLowerCase()] = phone;
        localStorage.setItem('gerisin_sales_db', JSON.stringify(db));

        if (db.config && db.config.scriptUrl) {
            fetch(db.config.scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'ORDER', ...lastCreatedOrder })
            }).catch(err => console.log('Sync error:', err));
        }

        document.getElementById('tkDate').innerText = dateStr;
        document.getElementById('tkClient').innerText = client;
        document.getElementById('tkPhone').innerText = phone;
        document.getElementById('tkProduct').innerText = currentSale.title;
        document.getElementById('tkQty').innerText = `${qty} pzs`;
        document.getElementById('tkTotal').innerText = total.toFixed(2);

        document.getElementById('clientOrderForm').style.display = 'none';
        document.getElementById('orderSuccessView').style.display = 'block';
    }

    function downloadTicketImage() {
        const ticketEl = document.getElementById('ticketSquareContainer');
        html2canvas(ticketEl, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Ticket_${lastCreatedOrder.client}_Tacos.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function shareWhatsAppMessage() {
        if (!lastCreatedOrder) return;

        let msg = `Hola, realizo un pedido para *${lastCreatedOrder.client}*:\n\n`;
        msg += `• *Producto:* ${currentSale.title}\n`;
        msg += `• *Cantidad:* ${lastCreatedOrder.qty} pzs\n`;
        msg += `• *Total:* $${lastCreatedOrder.total.toFixed(2)}\n`;
        msg += `• *Estado:* Pendiente de pago al recibir\n`;
        msg += `• *WhatsApp del cliente:* ${lastCreatedOrder.phone}\n\n`;
        msg += `¡Adjunto la imagen de mi pedido!`;

        const url = `https://wa.me/52${TARGET_PHONE}?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
    }

    function resetOrderView() {
        document.getElementById('clientOrderForm').reset();
        document.getElementById('orderQty').value = 1;
        calculateTotal();
        document.getElementById('orderSuccessView').style.display = 'none';
        document.getElementById('clientOrderForm').style.display = 'block';
        updateDatalist();
    }
</script>
